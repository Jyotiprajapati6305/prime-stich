databases:
  - name: crochet-studio-db
    plan: free
    databaseName: crochet_studio
    user: crochet_studio

services:
  - type: web
    name: crochet-studio-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crochet-studio-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://crochet-studio-frontend.onrender.com

  - type: web
    name: crochet-studio-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://crochet-studio-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
